<h2>Enrollment Request Form</h2>

<div *ngIf="submitted">
  Enrollment request submitted successfully!
</div>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)">
  <div>
    <label for="studentName">Student Name:</label>
    <input type="text" id="studentName" name="studentName" [(ngModel)]="studentName" required minlength="3" #nameCtrl="ngModel">
    <div *ngIf="nameCtrl.touched && nameCtrl.errors">
      <span *ngIf="nameCtrl.errors['required']" style="color: red;">Name is required</span>
      <span *ngIf="nameCtrl.errors['minlength']" style="color: red;">Name must be at least 3 characters</span>
    </div>
  </div>

  <div>
    <label for="studentEmail">Email:</label>
    <input type="email" id="studentEmail" name="studentEmail" [(ngModel)]="studentEmail" required email #emailCtrl="ngModel">
    <div *ngIf="emailCtrl.touched && emailCtrl.errors">
      <span *ngIf="emailCtrl.errors['required']" style="color: red;">Email is required</span>
      <span *ngIf="emailCtrl.errors['email']" style="color: red;">Invalid email address</span>
    </div>
  </div>

  <div>
    <label for="courseId">Course ID:</label>
    <input type="number" id="courseId" name="courseId" [(ngModel)]="courseId" required #courseCtrl="ngModel">
    <div *ngIf="courseCtrl.touched && courseCtrl.errors">
      <span *ngIf="courseCtrl.errors['required']" style="color: red;">Course ID is required</span>
    </div>
  </div>

  <div>
    <label for="preferredSemester">Preferred Semester:</label>
    <select id="preferredSemester" name="preferredSemester" [(ngModel)]="preferredSemester" required #semesterCtrl="ngModel">
      <option value="" disabled>Select Semester</option>
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
    <div *ngIf="semesterCtrl.touched && semesterCtrl.errors">
      <span *ngIf="semesterCtrl.errors['required']" style="color: red;">Semester selection is required</span>
    </div>
  </div>

  <div>
    <label>
      <input type="checkbox" name="agreeToTerms" [(ngModel)]="agreeToTerms" required #termsCtrl="ngModel">
      I agree to the terms and conditions
    </label>
    <div *ngIf="termsCtrl.touched && termsCtrl.errors">
      <span *ngIf="termsCtrl.errors['required']" style="color: red;">You must agree to the terms</span>
    </div>
  </div>

  <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
  <button type="button" (click)="onReset(enrollForm)">Reset</button>
</form>
